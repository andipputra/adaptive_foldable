name: Publish to pub.dev

on:
  push:
    # pub.dev automated publishing accepts only tag pushes; branch pushes and
    # manual dispatch carry a branch token and are rejected.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/adaptive_foldable
