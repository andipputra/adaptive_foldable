name: Publish to pub.dev

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
    paths:
      - 'packages/adaptive_foldable/pubspec.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish adaptive_foldable
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify package quality
        run: |
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          dart run tool/check_layer_boundaries.dart
          (cd packages/adaptive_foldable && flutter test)

      - name: Verify pub dry-run
        run: |
          cd packages/adaptive_foldable
          dart pub publish --dry-run

      - name: Publish to pub.dev
        run: |
          cd packages/adaptive_foldable
          dart pub publish --force
