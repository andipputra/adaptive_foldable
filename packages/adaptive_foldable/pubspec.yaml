name: adaptive_foldable
description: A design-agnostic Flutter navigation scaffold with a fold kit.
version: 0.0.1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Router coverage tests only; never a runtime dependency.
  go_router: ^18.1.4

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AdaptiveFoldablePlugin

